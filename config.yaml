scoring:
  momentum_windows:
    mom_1m: 21
    mom_3m: 63
    mom_6m: 126
    mom_12m: 252
  momentum_weights:
    mom_1m: 0.10
    mom_3m: 0.20
    mom_6m: 0.30
    mom_12m: 0.40
  trend_sma_windows:
    - 50
    - 200
  trend_bonus_per_sma: 0.05
  volatility_window: 20
  # リスク調整: スコアをボラティリティで割って低ボラ資産を優遇
  vol_adjust: true

allocation:
  method: score_proportional
  top_n: 15
  min_assets: 5

risk:
  max_weight_per_asset: 0.25
  min_weight_per_selected: 0.02
  max_category_weights:
    core_equity: 0.50
    growth_equity: 0.25
    theme_equity: 0.15
    emerging_equity: 0.15
    bond: 0.45
    cash_like: 0.40
    commodity: 0.20
    reit: 0.20
    small_cap: 0.15
    sector: 0.30
    fx: 0.10
    factor: 0.20
  # リスクオフ判定: sp500の60日リターンがこの閾値を下回ったらリスクオフ
  risk_off_ticker: VOO
  risk_off_window: 60
  risk_off_threshold: -0.07
  risk_off_equity_cap: 0.40

turnover:
  # 通常運用時のターンオーバー上限
  normal_limit: 0.20
  # 移行運用時のターンオーバー上限（配分ルール変更直後などに使用）
  migration_limit: 0.50
  # true にすると migration_limit が適用される（通常は false）
  migration_mode: false

report:
  output_dir: outputs
  include_correlation_matrix: true
  top_n_display: 15

data:
  fetch_years: 3
  min_history_days: 260

risk_mode_checks:
  enabled: true
  # Risk-ON時に防御資産比率がこの値を超えると PASS_WITH_CAUTION
  risk_on_defensive_warning_threshold: 0.60
  # Risk-ON時に防御資産比率がこの値を超えると REVIEW_REQUIRED
  risk_on_defensive_review_threshold: 0.75
  # 防御資産と判定するカテゴリ
  defensive_categories:
    - bond
    - cash_like
    - commodity
    - fx

global_settings:
  # 最終配分の最大保有本数（eligible ETF数に応じて自動調整）
  # eligible >= 8 → max_portfolio_assets本
  # eligible 4〜7 → 3本
  # eligible 1〜3 → eligible本数
  # eligible 0    → 1本（キャッシュ）
  max_portfolio_assets: 4

ai_audit:
  # AI監査を有効にするか（環境変数 AI_AUDIT_ENABLED でも制御可能）
  enabled: false
  # LLMプロバイダー: claude | openai | gemini（将来対応）
  provider: claude
  # 使用モデル。providerに合わせて変更する
  # claude: claude-3-5-sonnet-latest / openai: gpt-4o
  model: claude-3-5-sonnet-latest
  # Phase 2では常にfalse（AI提案は参考情報のみ）
  apply_adjustment: false
